name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-
      - name: Test the package
        run: swift test
  hosted:
    runs-on: xcode-27
    env:
      SIMULATOR: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ hashFiles('Package.resolved') }}
          restore-keys: derived-
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate and build for testing
        run: sh CoreFlowHosted/build.sh
      # Serial on purpose. The boot's first minutes own the disk: started in
      # the background it made the derived-data restore take 113 s instead of
      # 7 s and `brew install xcodegen` 119 s instead of 9 s (runs 40, 41),
      # and xcodebuild blocks on CoreSimulatorService until the boot
      # completes anyway. Booting explicitly, never through the first app
      # launch: on a cold runner that timed out ("Timed out while launching
      # application via Xcode", 129 s).
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b
      - name: Run the hosted UI tests
        run: sh CoreFlowHosted/test.sh "$SIMULATOR"
