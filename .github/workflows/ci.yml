name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-
      - name: Build and test the package
        run: swift build && swift test
  hosted:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Warm simulator: the device's data directory after one boot, so the
      # next run skips first-boot initialization. Keyed on the iOS runtime
      # build; the UDID is the image's pre-created device.
      - name: Resolve simulator UDID and runtime build
        id: sim
        run: |
          echo "udid=$(xcrun simctl list -j devices available | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name == "iPhone 17 Pro") | .udid' | head -1)" >> "$GITHUB_OUTPUT"
          echo "build=$(xcrun simctl list -j runtimes | jq -r '.runtimes[] | select(.platform == "iOS") | .buildversion' | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache warm simulator
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }}/data
          key: sim-${{ steps.sim.outputs.build }}
      # Fire and forget: the boot overlaps the steps below that never open
      # CoreSimulator. xcodebuild waits for whatever boot remains (measured:
      # it blocks on CoreSimulatorService until the boot completes), so this
      # buys at most the derived-data restore, install, and generate time.
      # Booting explicitly, never through the first app launch: on a cold
      # runner that timed out ("Timed out while launching application via
      # Xcode", 129 s).
      - name: Boot simulator in the background
        run: nohup xcrun simctl boot "${{ steps.sim.outputs.udid }}" >/dev/null 2>&1 &
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ hashFiles('Package.resolved') }}
          restore-keys: derived-
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate and build for testing
        run: sh CoreFlowHosted/build.sh
      - name: Wait for the simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Run the hosted UI tests
        run: sh CoreFlowHosted/test.sh
      # Quiescent for the warm-simulator cache saved at the end of the job.
      - name: Shut down the simulator
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}"
