name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: swift build && swift test
  hosted:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd CoreFlowHosted && sh test.sh
