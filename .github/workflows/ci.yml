name: CI
on: [push, pull_request]
jobs:
  package:
    name: Unit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: spm-
      - name: Test the package
        run: swift test --enable-code-coverage
      - name: Keep the coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-package
          path: .build/debug/codecov/
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      matrix:
        platform: [tvos, watchos, visionos, ios-macabi]
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: build-${{ matrix.platform }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: build-${{ matrix.platform }}-
      - name: Build the package
        run: swift build --triple arm64-apple-${{ matrix.platform }}
  hosted:
    name: UI tests on ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: macos
            destination: platform=macOS
          - name: ios
            destination: platform=iOS Simulator,name=iPhone 18 Pro
    steps:
      - uses: actions/checkout@v5
      - name: Cache derived data
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ matrix.name }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: derived-${{ matrix.name }}-
      # The tests click on the runner's own desktop. macOS has to allow that.
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Run the unit and UI tests
        run: sh test.sh "${{ matrix.destination }}"
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CoreFlow-${{ matrix.name }}.xcresult
          path: CoreFlow.xcresult
