name: CI
on: [push, pull_request]
jobs:
  package:
    name: Unit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: spm-
      - name: Test the package
        run: swift test --enable-code-coverage
      - name: Keep the coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-package
          path: .build/debug/codecov/
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      matrix:
        platform: [macos, ios, ios-simulator, ios-macabi, tvos, watchos, visionos]
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: build-${{ matrix.platform }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: build-${{ matrix.platform }}-
      - name: Build the package
        run: swift build --triple arm64-apple-${{ matrix.platform }}
  hosted:
    name: Tests on macOS
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Cache derived data
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: derived-
      # The tests click on the runner's own desktop. macOS has to allow that.
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Run the unit and UI tests
        run: sh test.sh platform=macOS
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CoreFlow.xcresult
          path: CoreFlow.xcresult
      - name: Convert the coverage to Cobertura
        run: brew install -q xcresultparser && xcresultparser -o cobertura -p "$PWD" CoreFlow.xcresult > coverage.xml
      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: coreflow
          disable_search: true
