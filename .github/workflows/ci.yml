name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-
      - name: Test the package
        run: swift test
  hosted:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ hashFiles('Package.resolved') }}
          restore-keys: derived-
      - name: Install xcodegen
        run: brew install xcodegen
      # The tests run the app as Mac Catalyst and click on the runner's own
      # desktop: no simulator to boot. macOS has to allow that.
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Build and run the hosted UI tests
        run: |
          set -o pipefail
          sh CoreFlowHosted/test.sh 2>&1 | tee test.log
      # Each failed test's activity timeline and errors — or, when the build
      # failed, its errors — as one annotation: readable on the run page and
      # through the API without opening the log.
      - name: Report the failures
        if: failure()
        run: |
          awk '/^Test Case .* started\./{buf=""} {buf=buf $0 "\n"} /^Test Case .* failed \(/{printf "%s", buf}' test.log | grep -E "t = |error: |^Test Case" | sed -E 's|.*/UITests/||' | cut -c1-200 | head -150 > failures.txt || true
          [ -s failures.txt ] || grep -E "error: |BUILD FAILED" test.log | cut -c1-300 | head -30 > failures.txt || true
          grep -E "Executed [0-9]+ tests" test.log | tail -1 >> failures.txt || true
          echo "::error title=Hosted UI tests::$(awk '{printf "%s%%0A", $0}' failures.txt)"
