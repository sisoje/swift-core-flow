name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - run: swift build && swift test
  hosted:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - run: brew install xcodegen
      - run: cd CoreFlowHosted && sh test.sh
