name: CoreFlowExample
options:
  bundleIdPrefix: com.coreflow.examples
  deploymentTarget:
    iOS: "17.0"
packages:
  CoreFlowExampleUI:
    path: CoreFlowExampleUI
targets:
  # The real app — normal `import CoreFlowExampleUI`, public hosts, live SwiftData.
  CoreFlowRealApp:
    type: application
    platform: iOS
    sources: [RealApp]
    dependencies:
      - package: CoreFlowExampleUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGNING_ALLOWED: NO
  # The testing app — one file: `@testable import CoreFlowExampleUI` reaches
  # the library's internal scenarios (and through them the internal Cores);
  # hosts the log element.
  CoreFlowTestApp:
    type: application
    platform: iOS
    sources: [TestApp]
    dependencies:
      - package: CoreFlowExampleUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGNING_ALLOWED: NO
  CoreFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CoreFlowTestApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # No MainActor default here: XCTestCase's inherited inits are
        # nonisolated, and a MainActor-by-default subclass can't override them.
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: CoreFlowTestApp
schemes:
  CoreFlowRealApp:
    build:
      targets:
        CoreFlowRealApp: all
    run:
      config: Debug
    test:
      config: Debug
      # Same UI tests as the test scheme: TEST_TARGET_NAME on the bundle is
      # CoreFlowTestApp, so Cmd-U here still drives the TestApp's scenarios —
      # the real app is what you RUN, the tests always run as per the TestApp.
      debugEnabled: false
      targets:
        - CoreFlowUITests
  CoreFlowTestApp:
    build:
      targets:
        CoreFlowTestApp: all
    run:
      config: Debug
    test:
      config: Debug
      # No lldb attach on Cmd-U — attaching to the UI-test runner is denied on
      # this macOS/Xcode beta pair even with developer mode enabled, and the
      # xcodebuild path (test.sh) never attaches anyway. Cost: no breakpoints
      # inside tests.
      debugEnabled: false
      targets:
        - CoreFlowUITests
