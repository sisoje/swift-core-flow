name: CoreFlowHosted
options:
  bundleIdPrefix: com.coreflow.hosted
  deploymentTarget:
    iOS: "27.0"
packages:
  CoreFlow:
    path: ..
# The tests run the app as Mac Catalyst: no simulator to boot. A Catalyst app
# is a macOS process, so it must be signed (ad hoc is enough; unsigned, the
# test runner is killed at launch), and the hardened runtime stays off so the
# runner loads the ad-hoc test bundle.
settings:
  base:
    SUPPORTS_MACCATALYST: YES
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  # The scenarios live here, not in the package; each launch picks one from
  # the TestPayload in its environment.
  CoreFlowHostApp:
    type: application
    platform: iOS
    sources: [HostApp, Shared]
    dependencies:
      - package: CoreFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_IDENTITY: "-"
  CoreFlowHostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, Shared]
    dependencies:
      - target: CoreFlowHostApp
      - package: CoreFlow
        product: CoreFlowUITesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # No MainActor default: XCTestCase's inherited inits are nonisolated.
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: CoreFlowHostApp
schemes:
  CoreFlowHostApp:
    build:
      targets:
        CoreFlowHostApp: all
    run:
      config: Debug
    test:
      config: Debug
      debugEnabled: false
      gatherCoverageData: true
      targets:
        - CoreFlowHostUITests
